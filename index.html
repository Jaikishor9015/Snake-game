<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Developer Snake</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <main class="game-layout">
      <aside class="sidebar">
        <h1>Star Developer <span>Snake</span></h1>

        <section class="score-panel">
          <div class="score-card">
            <span>YOUR SCORE</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-card best-card">
            <span>HIGH SCORE</span>
            <strong id="highScore">0</strong>
          </div>
        </section>

        <label for="speed">Game Speed</label>
        <select id="speed">
          <option value="220">Slow</option>
          <option value="150" selected>Medium</option>
          <option value="85">Fast</option>
        </select>

        <h2>Controls</h2>
        <div class="mobile-controls" aria-label="Snake movement controls">
          <button
            type="button"
            class="control-btn up"
            data-direction="up"
            aria-label="Move up"
          >
            ▲
          </button>

          <div class="horizontal-controls">
            <button
              type="button"
              class="control-btn"
              data-direction="left"
              aria-label="Move left"
            >
              ◀
            </button>
            <button
              type="button"
              class="control-btn"
              data-direction="down"
              aria-label="Move down"
            >
              ▼
            </button>
            <button
              type="button"
              class="control-btn"
              data-direction="right"
              aria-label="Move right"
            >
              ▶
            </button>
          </div>
        </div>

        <p class="help-text">Use the arrow keys or tap the buttons.</p>

        <button type="button" id="startButton" class="start-btn">
          Start Game
        </button>
        <p id="status" role="status">Ready to play?</p>
      </aside>

      <section class="board-section">
        <div class="board-heading">
          <span>THE ARENA</span>
          <span class="live-indicator">● READY</span>
        </div>
        <canvas
          id="cobra"
          width="512"
          height="512"
          aria-label="Snake game board"
        ></canvas>
        <p class="board-tip">
          Eat the glowing food. Avoid the walls and yourself.
        </p>
      </section>
    </main>
  </body>
</html>
